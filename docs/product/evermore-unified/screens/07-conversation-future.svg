 x="84" y="502" width="284" height="93" rx="17" fill="#29463A" stroke="none" stroke-width="1"/><text x="102" y="532" class="body" fill="#F4EFE6" >Weekend breakfast together.</text><text x="102" y="552" class="body" fill="#F4EFE6" >Fresh coffee and no hurry.</text><text x="338" y="579" class="tiny" fill="#C9D0C4" text-anchor="end">10:46</text><rect x="23" y="629" width="345" height="50" rx="22" fill="#FFFBF4" stroke="#D2C6B6" stroke-width="1"/><text x="43" y="661" class="body" fill="#9A8E80" >Write a thoughtful reply…</text><circle cx="344" cy="654" r="17" fill="#AFC0B3"/><text x="342" y="659" class="body" fill="#201E1B" text-anchor="middle">→</text><rect x="22" y="693" width="346" height="61" rx="12" fill="#F5E8DE" stroke="#DEC1AF" stroke-width="1"/><text x="39" y="715" class="button" fill="#9E3A22" >Privacy first</text><text x="39" y="738" class="small" fill="#201E1B" >Block or report at any point.</text><rect x="0" y="772" width="390" height="72" rx="0" fill="#F4EFE6" stroke="none" stroke-width="1"/><path d="M0 772L390 772" stroke="#D6C9B7" stroke-opacity="1"/><circle cx="57" cy="798" r="6" fill="none" stroke="#8D7A70" stroke-width="1.5"/><text x="57" y="821" class="tiny" fill="#6C6158" text-anchor="middle">Today</text><circle cx="153" cy="798" r="6" fill="none" stroke="#EE9A7C" stroke-width="1.5"/><text x="153" y="821" class="tiny" fill="#EE9A7C" text-anchor="middle">Matches</text><circle cx="253" cy="798" r="6" fill="none" stroke="#8D7A70" stroke-width="1.5"/><text x="253" y="821" class="tiny" fill="#6C6158" text-anchor="middle">Messages</text><circle cx="342" cy="798" r="6" fill="none" stroke="#8D7A70" stroke-width="1.5"/><text x="342" y="821" class="tiny" fill="#6C6158" text-anchor="middle">Account</text></svg>