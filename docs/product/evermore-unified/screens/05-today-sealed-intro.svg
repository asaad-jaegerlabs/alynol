roke-width="2.1"/></g><text x="195" y="340" class="cap" fill="#9E3A22" text-anchor="middle">TODAY'S FIRST LETTER</text><text x="195" y="387" class="serif" fill="#201E1B" text-anchor="middle">Elena</text><text x="195" y="414" class="body" fill="#81786D" text-anchor="middle">Runs the home</text><text x="195" y="466" class="cap" fill="#9E3A22" text-anchor="middle">FIRST NAME ONLY</text><text x="23" y="692" class="small" fill="#C5B9AA" >A yes is private until it's mutual.</text><rect x="23" y="708" width="163" height="52" rx="26" fill="transparent" stroke="none" stroke-width="1"/><text x="104.5" y="740" class="button" fill="#F4EFE6" text-anchor="middle">Pass</text><rect x="23" y="708" width="163" height="52" rx="26" fill="none" stroke="#67584D" stroke-width="1"/><rect x="197" y="708" width="170" height="52" rx="26" fill="#EE9A7C" stroke="none" stroke-width="1"/><text x="282" y="740" class="button" fill="#171613" text-anchor="middle">I'm interested  →</text><rect x="0" y="772" width="390" height="72" rx="0" fill="#171613" stroke="none" stroke-width="1"/><path d="M0 772L390 772" stroke="#47423A" stroke-opacity="1"/><circle cx="57" cy="798" r="6" fill="none" stroke="#EE9A7C" stroke-width="1.5"/><text x="57" y="821" class="tiny" fill="#EE9A7C" text-anchor="middle">Today</text><circle cx="153" cy="798" r="6" fill="none" stroke="#AA9E8F" stroke-width="1.5"/><text x="153" y="821" class="tiny" fill="#A9A294" text-anchor="middle">Matches</text><circle cx="253" cy="798" r="6" fill="none" stroke="#AA9E8F" stroke-width="1.5"/><text x="253" y="821" class="tiny" fill="#A9A294" text-anchor="middle">Messages</text><circle cx="342" cy="798" r="6" fill="none" stroke="#AA9E8F" stroke-width="1.5"/><text x="342" y="821" class="tiny" fill="#A9A294" text-anchor="middle">Account</text></svg>