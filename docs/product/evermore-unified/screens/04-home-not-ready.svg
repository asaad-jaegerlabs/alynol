" y="476" class="body" fill="#E1E9DA" >matching pool is ready on both sides.</text><text x="40" y="501" class="small" fill="#BACABA" >No estimated date. No filler profiles.</text><text x="23" y="577" class="cap" fill="#9E3A22" >INVITE SOMEBODY YOU KNOW</text><rect x="21" y="590" width="350" height="76" rx="13" fill="#FBF7EF" stroke="#D5C5B3" stroke-width="1"/><text x="39" y="621" class="h3" fill="#201E1B" >Your two invitations</text><text x="39" y="642" class="small" fill="#81786D" >Available after your account qualifies</text><text x="347" y="630" class="serif" fill="#9E3A22" >›</text><rect x="21" y="678" width="350" height="71" rx="13" fill="#F8F2E8" stroke="#D3C8BA" stroke-width="1"/><text x="39" y="706" class="h3" fill="#201E1B" >Privacy and safety</text><text x="39" y="729" class="small" fill="#81786D" >Block, report or contact the team</text><rect x="0" y="771" width="390" height="73" rx="0" fill="#F4EFE6" stroke="none" stroke-width="1"/><line x1="0" y1="771" x2="390" y2="771" stroke="#D6CCBC" stroke-opacity="1"/><circle cx="59" cy="797" r="6" fill="none" stroke="#EE9A7C" stroke-width="1.7"/><text x="59" y="821" class="tiny" fill="#EE9A7C" text-anchor="middle">Today</text><circle cx="153" cy="797" r="6" fill="none" stroke="#777064" stroke-width="1.7"/><text x="153" y="821" class="tiny" fill="#777064" text-anchor="middle">Matches</text><circle cx="254" cy="797" r="6" fill="none" stroke="#777064" stroke-width="1.7"/><text x="254" y="821" class="tiny" fill="#777064" text-anchor="middle">Messages</text><circle cx="342" cy="797" r="6" fill="none" stroke="#777064" stroke-width="1.7"/><text x="342" y="821" class="tiny" fill="#777064" text-anchor="middle">Account</text></svg>